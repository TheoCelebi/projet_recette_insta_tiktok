<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon carnet</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#F6F0E4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1A1512" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Carnet">
<link rel="apple-touch-icon" href="/icon-180.png">
<link rel="preload" href="/fonts/fraunces.woff2" as="font" type="font/woff2" crossorigin>
<style>
  @font-face { font-family: "Fraunces"; font-style: normal; font-weight: 300 600; font-display: swap;
               src: url(/fonts/fraunces.woff2) format("woff2"); }
  @font-face { font-family: "Fraunces"; font-style: italic; font-weight: 300 600; font-display: swap;
               src: url(/fonts/fraunces-italic.woff2) format("woff2"); }
  @font-face { font-family: "DM Sans"; font-style: normal; font-weight: 400 600; font-display: swap;
               src: url(/fonts/dmsans.woff2) format("woff2"); }

  :root {
    --paper: #F6F0E4; --card: #FBF7EF; --ink: #2E2318; --soft: #6E5A48; --muted: #9A6B4F;
    --line: #E3D7C4; --accent: #C4683E; --accent-ink: #FFF8EF; --wash: #EFE4D2; --danger: #B3402A;
    --carb: #D9A441; --fat: #8A9A6B;
    --serif: "Fraunces", Georgia, serif; --sans: "DM Sans", -apple-system, system-ui, sans-serif;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1A1512; --card: #241D18; --ink: #F1E7D8; --soft: #C9B8A4; --muted: #B59A82;
      --line: #3A2F27; --accent: #E08A5F; --accent-ink: #1A1512; --wash: #2E2620; --danger: #F08A72;
      --carb: #C9973A; --fat: #7C8C5E; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1A1512; --card: #241D18; --ink: #F1E7D8; --soft: #C9B8A4; --muted: #B59A82;
    --line: #3A2F27; --accent: #E08A5F; --accent-ink: #1A1512; --wash: #2E2620; --danger: #F08A72;
    --carb: #C9973A; --fat: #7C8C5E; color-scheme: dark;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { background: var(--paper); }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 16px/1.55 var(--sans);
         -webkit-font-smoothing: antialiased; }
  main { max-width: 720px; margin: 0 auto;
         padding: max(16px, env(safe-area-inset-top)) 16px calc(48px + env(safe-area-inset-bottom)); }
  a { color: inherit; }
  button { font: 500 15px var(--sans); cursor: pointer; border: 0; color: inherit; background: none; }
  .eyebrow { font-size: 11px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
  .meta { font-size: 13px; color: var(--muted); }

  /* En-tête */
  .top { display: flex; justify-content: space-between; align-items: flex-start; margin: 4px 0 18px; }
  .top h1 { font: 400 34px/1.05 var(--serif); margin: 6px 0 0; letter-spacing: -.01em; }
  .top h1 em { font-weight: 300; color: var(--accent); }
  .icon-btn { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center;
              border: 1px solid var(--line); color: var(--soft); flex: none; }
  .icon-btn svg { width: 18px; height: 18px; }

  /* Import */
  .import { display: flex; gap: 6px; padding: 5px 5px 5px 16px; border: 1px solid var(--line);
            border-radius: 99px; background: var(--card); margin-bottom: 18px; }
  .import input { flex: 1; min-width: 0; border: 0; background: none; color: var(--ink); font: 15px var(--sans); outline: none; }
  .import input::placeholder { color: var(--muted); }
  .btn { background: var(--accent); color: var(--accent-ink); border-radius: 99px; padding: 10px 18px; }
  .btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
  .btn:active { transform: scale(.97); }

  /* Filtres */
  .chips { display: flex; gap: 8px; overflow-x: auto; margin: 0 -16px 20px; padding: 0 16px; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip { flex: none; padding: 6px 14px; border-radius: 99px; border: 1px solid var(--line);
          font-size: 13px; color: var(--soft); white-space: nowrap; }
  .chip.on { background: var(--ink); color: var(--paper); border-color: var(--ink); }

  /* Cartes */
  .photo { background: var(--wash) center/cover no-repeat; border-radius: 6px; display: grid; place-items: center;
           color: var(--muted); overflow: hidden; }
  .photo svg { width: 34px; height: 34px; opacity: .7; }
  .feature { display: block; text-decoration: none; margin-bottom: 26px; }
  .feature .photo { aspect-ratio: 4/3; }
  .feature h2 { font: 400 26px/1.12 var(--serif); margin: 6px 0 4px; letter-spacing: -.01em; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 22px 14px; }
  .card { display: block; text-decoration: none; }
  .card .photo { aspect-ratio: 1; }
  .card h3 { font: 400 17px/1.2 var(--serif); margin: 8px 0 2px; }
  .card.err h3 { color: var(--danger); }
  .rule { display: flex; align-items: center; gap: 12px; margin: 4px 0 16px; }
  .rule::after { content: ""; flex: 1; height: 1px; background: var(--line); }

  .spinner { width: 26px; height: 26px; border: 2px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }

  .empty { text-align: center; padding: 48px 12px; }
  .empty h2 { font: 400 italic 28px/1.2 var(--serif); margin: 18px 0 8px; }
  .empty p { color: var(--soft); max-width: 340px; margin: 0 auto; }
  .empty svg { width: 64px; height: 64px; color: var(--accent); }

  .offline { border: 1px dashed var(--muted); color: var(--soft); border-radius: 10px; padding: 10px 14px;
             font-size: 14px; margin-bottom: 18px; }

  /* Fiche recette */
  .hero { margin: calc(-1 * max(16px, env(safe-area-inset-top))) -16px 18px; position: relative; }
  .hero .photo { border-radius: 0; aspect-ratio: 4/3; max-height: 62vh; width: 100%; }
  .hero .icon-btn { position: absolute; top: max(16px, env(safe-area-inset-top)); left: 16px; background: var(--paper); border: 0; }
  .detail h2 { font: 400 34px/1.08 var(--serif); margin: 8px 0 10px; letter-spacing: -.015em; }
  .summary { font: 300 italic 18px/1.45 var(--serif); color: var(--soft); margin: 0 0 6px; }
  .facts { display: grid; grid-template-columns: repeat(3, 1fr); border-top: 1px solid var(--line);
           border-bottom: 1px solid var(--line); margin: 20px 0 24px; }
  .facts div { padding: 12px 0; text-align: center; }
  .facts div + div { border-left: 1px solid var(--line); }
  .facts b { display: block; font: 400 19px var(--serif); }
  .sec-title { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
  .sec-title h3 { font: 400 24px var(--serif); margin: 0; }
  .stepper { display: flex; align-items: center; gap: 4px; font-size: 14px; color: var(--soft); }
  .stepper button { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--line); font-size: 18px; line-height: 1; }
  .stepper span { min-width: 64px; text-align: center; }
  h4 { font: 400 italic 17px var(--serif); color: var(--accent); margin: 16px 0 2px; }
  ul.ing { list-style: none; padding: 0; margin: 0 0 30px; }
  ul.ing li { display: grid; grid-template-columns: 22px 78px 1fr; gap: 8px; align-items: baseline;
              padding: 11px 0; border-bottom: 1px dotted var(--line); cursor: pointer; transition: opacity .2s; }
  ul.ing .box { width: 16px; height: 16px; border: 1.5px solid var(--muted); border-radius: 4px; align-self: center;
                display: grid; place-items: center; transition: background .15s, border-color .15s; }
  ul.ing li.done { opacity: .45; }
  ul.ing li.done .box { background: var(--accent); border-color: var(--accent); }
  ul.ing li.done .box::after { content: ""; width: 8px; height: 4px; border: solid var(--accent-ink);
                                border-width: 0 0 2px 2px; transform: rotate(-45deg) translate(1px, -1px); }
  ul.ing li.done .name { text-decoration: line-through; }
  ul.ing .q { font: 500 16px var(--serif); color: var(--accent); }
  ol.steps { list-style: none; padding: 0; margin: 0 0 30px; counter-reset: s; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 44px 1fr; padding: 12px 0;
                border-bottom: 1px solid var(--line); }
  ol.steps li::before { content: counter(s, decimal-leading-zero); font: 300 italic 22px/1.2 var(--serif); color: var(--accent); }
  .note { background: var(--wash); border-radius: 10px; padding: 16px 18px; margin-bottom: 28px; }
  .note h3 { font: 400 italic 20px var(--serif); margin: 0 0 6px; }
  .note ul { margin: 0; padding-left: 18px; color: var(--soft); }
  .note li { margin: 4px 0; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .actions .btn { flex: 1 1 auto; text-align: center; }
  .cook-cta { width: 100%; padding: 15px; font-size: 16px; margin-bottom: 26px; display: flex; gap: 8px;
              justify-content: center; align-items: center; }
  .cook-cta svg { width: 18px; height: 18px; }
  .center { display: grid; place-items: center; gap: 12px; padding: 48px 0; text-align: center; }
  .center h2 { font: 400 italic 24px var(--serif); margin: 0; }

  /* Mode cuisine */
  .cook { position: fixed; inset: 0; background: var(--paper); z-index: 10; display: flex; flex-direction: column;
          padding: max(16px, env(safe-area-inset-top)) 20px calc(20px + env(safe-area-inset-bottom)); }
  .cook-head { display: flex; justify-content: space-between; align-items: center; }
  .progress { height: 2px; background: var(--line); margin: 14px 0 0; }
  .progress i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
  .cook-body { flex: 1; display: flex; flex-direction: column; justify-content: center; max-width: 640px;
               margin: 0 auto; width: 100%; }
  .cook-num { font: 300 italic 64px/1 var(--serif); color: var(--accent); }
  .cook-text { font: 400 28px/1.3 var(--serif); margin: 14px 0 22px; }
  .timer { align-self: flex-start; display: flex; align-items: center; gap: 8px; border: 1px solid var(--accent);
           color: var(--accent); border-radius: 99px; padding: 10px 18px; font-variant-numeric: tabular-nums; }
  .timer.running { background: var(--accent); color: var(--accent-ink); }
  .timer.ring { animation: ring .5s ease-in-out infinite alternate; }
  @keyframes ring { to { transform: scale(1.06); } }
  .cook-nav { display: grid; grid-template-columns: 1fr 2fr; gap: 10px; max-width: 640px; margin: 0 auto; width: 100%; }
  .cook-nav .btn { padding: 16px; font-size: 16px; }
  .cook-ings { font-size: 14px; color: var(--soft); }

  .toast { position: fixed; bottom: calc(24px + env(safe-area-inset-bottom)); left: 50%; transform: translateX(-50%);
           background: var(--ink); color: var(--paper); padding: 10px 18px; border-radius: 99px; font-size: 14px; z-index: 20; }
  .fade { animation: fade .35s ease both; }
  @keyframes fade { from { opacity: 0; transform: translateY(6px); } }
  @media (prefers-reduced-motion: reduce) { .fade, .timer.ring { animation: none; } }

  /* Dossiers */
  .folders { display: flex; gap: 12px; overflow-x: auto; margin: 0 -16px 22px; padding: 2px 16px; scrollbar-width: none; }
  .folders::-webkit-scrollbar { display: none; }
  .folder { flex: none; width: 128px; text-decoration: none; text-align: left; padding: 0; }
  .folder .cover { width: 128px; height: 128px; border-radius: 8px; overflow: hidden; display: grid;
                   grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 2px; background: var(--wash); }
  .folder .cover > div { background: var(--wash) center/cover no-repeat; }
  .folder .cover.one > div { grid-column: 1 / -1; grid-row: 1 / -1; }
  .folder .cover.two { grid-template-rows: 1fr; }
  .folder .cover.three > div:first-child { grid-row: 1 / -1; }
  .folder .cover.empty, .folder.new .cover { grid-template-columns: 1fr; grid-template-rows: 1fr; place-items: center; color: var(--muted); }
  .folder.new .cover { background: none; border: 1.5px dashed var(--line); color: var(--accent); }
  .folder .cover svg { width: 30px; height: 30px; }
  .folder b { display: block; font: 400 16px/1.2 var(--serif); margin-top: 8px; }
  .folder .meta { font-size: 12px; }
  .fchips { display: flex; flex-wrap: wrap; gap: 6px; margin: 14px 0 0; }
  .fchip { border: 1px solid var(--line); border-radius: 99px; padding: 5px 12px; font-size: 13px; color: var(--soft); text-decoration: none; }
  .fchip.add { border-style: dashed; color: var(--accent); }
  .fhead h2 { font: 400 34px/1.08 var(--serif); margin: 4px 0 8px; letter-spacing: -.015em; }
  .status { display: flex; align-items: center; gap: 10px; border: 1px dashed var(--line); border-radius: 10px;
            padding: 10px 14px; font-size: 14px; color: var(--soft); margin: 14px 0; }
  .status .spinner { width: 18px; height: 18px; flex: none; }

  /* Nutrition */
  .macros { display: grid; grid-template-columns: repeat(4, 1fr); text-align: center; margin: -8px 0 6px; }
  .macros b { display: block; font: 400 21px var(--serif); }
  .macros span { font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
  .macros-note { text-align: center; font-size: 12px; color: var(--muted); margin-bottom: 22px; }
  .macros-note a { color: var(--accent); }
  .nutri { border-top: 1px solid var(--line); padding-top: 18px; margin-bottom: 30px; }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 99px; padding: 3px; gap: 2px; }
  .seg button { padding: 6px 12px; border-radius: 99px; font-size: 13px; color: var(--soft); }
  .seg button.on { background: var(--ink); color: var(--paper); }
  .kcal { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 10px; flex-wrap: wrap; }
  .kcal b { font: 400 44px/1 var(--serif); }
  .ebar { display: flex; height: 10px; border-radius: 99px; overflow: hidden; background: var(--line); }
  .ebar i { display: block; height: 100%; }
  .legend { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0 18px; }
  .legend div { font-size: 13px; color: var(--soft); }
  .legend b { display: block; font: 400 20px var(--serif); color: var(--ink); }
  .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 6px; }
  table.nt { width: 100%; border-collapse: collapse; font-size: 15px; }
  table.nt td { padding: 8px 0; border-bottom: 1px dotted var(--line); }
  table.nt td.v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; padding-left: 8px; }
  table.nt td.pct { text-align: right; width: 54px; color: var(--muted); font-size: 13px; }
  table.nt tr.sub td:first-child { padding-left: 14px; color: var(--soft); font-size: 14px; }
  .badges { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 10px; }
  .badge { background: var(--wash); color: var(--accent); border-radius: 99px; padding: 4px 12px; font-size: 13px; font-weight: 500; }
  .switch { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--soft); margin: 14px 0 0; cursor: pointer; }
  .switch input, .check-row input { accent-color: var(--accent); width: 20px; height: 20px; flex: none; }
  details.by-ing summary { cursor: pointer; color: var(--accent); font-size: 14px; margin: 18px 0 6px; }
  .fine { font-size: 13px; color: var(--muted); margin-top: 14px; line-height: 1.5; }
  .link-btn { color: var(--accent); text-decoration: underline; font-size: 13px; padding: 0; }

  /* Fenêtres (bas d'écran sur téléphone) */
  .sheet-wrap { position: fixed; inset: 0; background: rgba(20, 14, 10, .45); z-index: 30; display: flex;
                align-items: flex-end; justify-content: center; }
  .sheet { background: var(--paper); width: 100%; max-width: 560px; border-radius: 18px 18px 0 0; max-height: 85vh;
           overflow: auto; padding: 22px 20px calc(20px + env(safe-area-inset-bottom)); }
  @media (min-width: 700px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 18px; } }
  .sheet h3 { font: 400 24px var(--serif); margin: 0 0 14px; }
  .field { display: block; margin-bottom: 14px; }
  .field span { display: block; font-size: 13px; color: var(--soft); margin-bottom: 6px; }
  .field input, .field textarea { width: 100%; border: 1px solid var(--line); background: var(--card); color: var(--ink);
                                  border-radius: 12px; padding: 12px 14px; font: 16px var(--sans); outline: none; resize: vertical; }
  .field input:focus, .field textarea:focus { border-color: var(--accent); }
  .check-row { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line);
               cursor: pointer; font-size: 16px; }
  .sheet .actions { margin-top: 18px; }
  .err-text { color: var(--danger); font-size: 13px; min-height: 18px; }

  /* Gestes : tirer pour recharger, glisser depuis le bord pour revenir */
  .ptr { position: fixed; top: calc(env(safe-area-inset-top) + 8px); left: 50%; z-index: 40; width: 40px; height: 40px;
         margin-left: -20px; border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--accent);
         display: grid; place-items: center; opacity: 0; transform: translateY(-60px); pointer-events: none; }
  .ptr svg { width: 20px; height: 20px; }
  .ptr.ready { background: var(--accent); color: var(--accent-ink); }
  .ptr.spin svg { animation: spin .8s linear infinite; }
  .swipe-back { position: fixed; top: 50%; left: 0; z-index: 40; width: 40px; height: 40px; margin-top: -20px;
                border-radius: 50%; background: var(--card); border: 1px solid var(--line); color: var(--ink);
                display: grid; place-items: center; opacity: 0; transform: translateX(-48px); pointer-events: none; }
  .swipe-back svg { width: 18px; height: 18px; }
  .swipe-back.ready { background: var(--accent); color: var(--accent-ink); }

  /* Tri et filtres */
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin: -6px 0 20px; }
  .tool { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 99px;
          padding: 6px 14px; font-size: 13px; color: var(--ink); }
  .tool svg { width: 15px; height: 15px; }
  .chip.small { font-size: 12px; padding: 5px 11px; }
  .range { display: block; padding: 12px 0; border-bottom: 1px solid var(--line); }
  .range span { display: flex; justify-content: space-between; font-size: 15px; margin-bottom: 10px; }
  .range b { font-weight: 500; color: var(--accent); }
  .range input { width: 100%; accent-color: var(--accent); }

  /* File d'attente hors ligne */
  .queue { display: grid; grid-template-columns: minmax(0, 1fr); gap: 8px; margin-bottom: 22px; }
  .qitem { display: flex; align-items: center; gap: 12px; border: 1px dashed var(--muted); border-radius: 12px; padding: 10px 12px; }
  .qicon { width: 36px; height: 36px; border-radius: 50%; background: var(--wash); display: grid; place-items: center;
           color: var(--accent); flex: none; }
  .qicon svg { width: 18px; height: 18px; }
  .qtext { flex: 1; min-width: 0; }
  .qtext b { display: block; font-weight: 500; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .qitem .icon-btn { width: 32px; height: 32px; }
</style>
</head>
<body>
<main id="view"></main>
<script>
const $view = document.getElementById("view");
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const api = (path, opts = {}) => fetch(path, { headers: { "Content-Type": "application/json" }, ...opts })
  .then(r => {
    if (r.ok) return r.json();
    // 502/503/504 : le Mac répond (Tailscale) mais le serveur de l'appli est arrêté.
    // Même traitement qu'une coupure réseau (TypeError) : hors ligne, file d'attente, réessais.
    if ([502, 503, 504].includes(r.status)) throw new TypeError("Serveur de l'appli arrêté sur le Mac");
    return r.json().catch(() => ({})).then(e => Promise.reject(new Error(
      typeof e.detail === "string" ? e.detail
        : r.status === 422 ? "Vérifie les champs du formulaire." : `Erreur du serveur (${r.status}).`)));
  });
let timer, activeTag = "";

const ICONS = {
  bowl: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M3 11h18a9 9 0 0 1-18 0Z"/><path d="M8 7c0-1.5 1-2 1-3.5M12 7c0-1.5 1-2 1-3.5M16 7c0-1.5 1-2 1-3.5"/></svg>',
  moon: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
  sun: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
  back: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>',
  refresh: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.3-5.6"/><path d="M20 4v4h-4"/></svg>',

};

/* ---------- Thème clair / sombre (suit le système, ou le choix de l'utilisateur) ---------- */
function getTheme() { try { return localStorage.getItem("theme"); } catch { return null; } }
function applyTheme(t) {
  if (t) document.documentElement.dataset.theme = t; else delete document.documentElement.dataset.theme;
}
const isDark = () => document.documentElement.dataset.theme === "dark" ||
  (!document.documentElement.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
function toggleTheme() {
  const next = isDark() ? "light" : "dark";
  applyTheme(next); try { localStorage.setItem("theme", next); } catch {}
  route();
}
applyTheme(getTheme());

/* ---------- Hors ligne : copie locale d'abord, Mac en arrière-plan ----------
   Chaque écran s'affiche immédiatement depuis la copie gardée sur l'appareil, puis on
   interroge le Mac ; on ne redessine que si quelque chose a changé. */
const STORE = "recipes-cache";
const ls = { get: k => { try { return localStorage.getItem(k); } catch { return null; } },
             set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };
let offline = ls.get("offline-hint") === "1";  // dernier état connu, pour le premier affichage
let navToken = 0;                               // invalide les rafraîchissements d'un écran quitté
const RETRY_MS = 10000;                         // hors ligne : on retente de joindre le Mac
const readStore = () => { try { return JSON.parse(ls.get(STORE)) || []; } catch { return []; } };
const writeStore = list => ls.set(STORE, JSON.stringify(list.filter(r => r.status === "done")));

async function getJSON(path) {
  const ctrl = new AbortController();
  const t = setTimeout(() => ctrl.abort(), 3000);
  try { const res = await api(path, { signal: ctrl.signal }); setOffline(false); return res; }
  catch (e) {
    if (e.name !== "AbortError" && !(e instanceof TypeError)) throw e;  // vraie erreur serveur (404...)
    setOffline(true); return null;
  } finally { clearTimeout(t); }
}
let retryTimer = null;
function setOffline(v) {
  offline = v; ls.set("offline-hint", v ? "1" : "0");
  // Mac injoignable (au chargement d'un écran ou pendant un envoi) : on retente régulièrement
  if (v && !retryTimer) retryTimer = setTimeout(() => { retryTimer = null; route(); }, RETRY_MS);
  if (!v && readQueue().length) setTimeout(flushQueue, 0);  // Mac de retour : on envoie les liens gardés
}

/* ---------- File d'attente : liens ajoutés hors ligne, envoyés au retour du Mac ---------- */
const QSTORE = "import-queue";
const readQueue = () => { try { return JSON.parse(ls.get(QSTORE)) || []; } catch { return []; } };
const writeQueue = q => ls.set(QSTORE, JSON.stringify(q));
function enqueue(text) {
  const m = String(text || "").match(/https?:\/\/\S+/);
  if (!m) { toast("Aucun lien trouvé."); return false; }
  const q = readQueue();
  if (!q.some(x => x.url === m[0])) { q.push({ url: m[0], added: Date.now() }); writeQueue(q); }
  toast("Lien gardé : il sera importé dès que le Mac répond");
  return true;
}
let flushing = false;
async function flushQueue() {
  if (flushing || offline || !readQueue().length) return;
  flushing = true;
  let sent = 0;
  try {
    for (const item of readQueue()) {
      try { await api("/api/recipes", { method: "POST", body: JSON.stringify({ url: item.url }) }); }
      catch (e) {
        if (e instanceof TypeError) break;  // Mac de nouveau injoignable : on garde le reste pour plus tard
        toast(`Lien refusé : ${e.message}`);
      }
      writeQueue(readQueue().filter(x => x.url !== item.url));
      sent++;
    }
  } finally { flushing = false; }
  if (sent) { toast(`${plural(sent, "lien")} en attente ${sent > 1 ? "envoyés" : "envoyé"} au Mac`); route(); }
}
function shortUrl(u) {
  try { const x = new URL(u); return (x.hostname.replace(/^www\./, "") + x.pathname).slice(0, 48); } catch { return u; }
}
function since(ts) {
  const min = Math.round((Date.now() - ts) / 60000);
  if (min < 1) return "à l'instant";
  if (min < 60) return `il y a ${min} min`;
  if (min < 1440) return `il y a ${Math.round(min / 60)} h`;
  return `le ${new Date(ts).toLocaleDateString("fr-FR", { day: "numeric", month: "short" })}`;
}
function queueHtml() {
  const q = readQueue();
  if (!q.length) return "";
  return `<div class="rule eyebrow">En attente de connexion · ${q.length}</div><div class="queue">${q.map(x => `
    <div class="qitem"><div class="qicon">${ICONS.clock}</div>
      <div class="qtext"><b>${esc(shortUrl(x.url))}</b>
        <span class="meta">${offline ? "Sera importé dès que le Mac répond" : "Envoi au Mac…"} · gardé ${since(x.added)}</span></div>
      <button class="icon-btn" data-unqueue="${esc(x.url)}" aria-label="Retirer ce lien">${ICONS.close}</button></div>`).join("")}</div>`;
}

/* ---------- Tri et filtres par macros (mémorisés sur l'appareil) ---------- */
const DEFAULT_PREFS = { sort: "recent", kcalMax: null, protMin: null, quick: false, badges: [] };
let prefs = (() => { try { return { ...DEFAULT_PREFS, ...JSON.parse(ls.get("filters")) }; } catch { return { ...DEFAULT_PREFS }; } })();
const savePrefs = () => ls.set("filters", JSON.stringify(prefs));
const SORTS = { recent: "Plus récentes", protein: "Plus protéinées", kcal: "Moins caloriques",
                density: "Meilleur rapport protéines / calories", time: "Plus rapides" };
const SPORT_BADGES = ["Riche en protéines", "Idéal après l'effort", "Avant l'effort", "Riche en fibres", "Pauvre en sucres"];
const pp = r => r.nutrition?.per_portion;
const filtersCount = (p = prefs) => (p.kcalMax != null) + (p.protMin != null) + p.quick + p.badges.length;
function applyPrefs(list, p = prefs) {
  const needsNutrition = p.kcalMax != null || p.protMin != null || p.badges.length;
  const out = list.filter(r => {
    if (r.status !== "done" || !r.data?.is_recipe) return !filtersCount(p);  // imports en cours : visibles sans filtre
    const n = pp(r);
    if (needsNutrition && !n) return false;
    if (p.kcalMax != null && n.kcal > p.kcalMax) return false;
    if (p.protMin != null && n.protein_g < p.protMin) return false;
    if (p.quick && !(total(r.data) && total(r.data) <= 30)) return false;
    return p.badges.every(b => (r.nutrition?.badges || []).includes(b));
  });
  const key = {
    protein: r => -(pp(r)?.protein_g ?? -Infinity), kcal: r => pp(r)?.kcal ?? Infinity,
    density: r => -(r.nutrition?.protein_per_100kcal ?? -Infinity), time: r => (r.data && total(r.data)) ?? Infinity,
  }[p.sort];
  return key ? [...out].sort((a, b) => key(a) - key(b)) : out;
}
function activeFilterChips() {
  return [
    prefs.sort !== "recent" && [`Tri : ${SORTS[prefs.sort].toLowerCase()}`, "sort"],
    prefs.kcalMax != null && [`≤ ${prefs.kcalMax} kcal`, "kcalMax"],
    prefs.protMin != null && [`≥ ${prefs.protMin} g de protéines`, "protMin"],
    prefs.quick && ["30 min max", "quick"],
    ...prefs.badges.map(b => [b, "badge:" + b]),
  ].filter(Boolean);
}
function clearPref(key) {
  if (key === "sort") prefs.sort = "recent";
  else if (key === "quick") prefs.quick = false;
  else if (key.startsWith("badge:")) prefs.badges = prefs.badges.filter(b => b !== key.slice(6));
  else prefs[key] = null;
  savePrefs();
}

function filtersSheet() {
  const draft = JSON.parse(JSON.stringify(prefs));
  const el = openSheet(`<h3>Trier et filtrer</h3>
    <div class="eyebrow" style="margin:4px 0 2px">Trier par</div>
    ${Object.entries(SORTS).map(([k, v]) => `<label class="check-row"><input type="radio" name="sort" value="${k}"
      ${draft.sort === k ? "checked" : ""}> ${v}</label>`).join("")}
    <div class="eyebrow" style="margin:22px 0 2px">Par portion</div>
    <label class="range"><span>Calories maximum <b id="kv"></b></span>
      <input type="range" id="kcal" min="200" max="1500" step="50" value="${draft.kcalMax ?? 1500}"></label>
    <label class="range"><span>Protéines minimum <b id="pv"></b></span>
      <input type="range" id="prot" min="0" max="60" step="5" value="${draft.protMin ?? 0}"></label>
    <label class="check-row"><input type="checkbox" id="quick" ${draft.quick ? "checked" : ""}> Prêt en 30 min maximum</label>
    <div class="eyebrow" style="margin:22px 0 2px">Repères sportifs</div>
    ${SPORT_BADGES.map(b => `<label class="check-row"><input type="checkbox" data-badge="${esc(b)}"
      ${draft.badges.includes(b) ? "checked" : ""}> ${b}</label>`).join("")}
    <div class="actions"><button class="btn ghost" id="freset">Réinitialiser</button><button class="btn" id="fapply"></button></div>`);
  const $ = q => el.querySelector(q);
  const refresh = () => {
    $("#kv").textContent = draft.kcalMax == null ? "sans limite" : `${draft.kcalMax} kcal`;
    $("#pv").textContent = draft.protMin == null ? "aucun" : `${draft.protMin} g`;
    $("#fapply").textContent = `Voir ${plural(applyPrefs(readStore(), draft).length, "recette")}`;
  };
  el.querySelectorAll("input[name=sort]").forEach(i => i.onchange = () => { draft.sort = i.value; refresh(); });
  $("#kcal").oninput = e => { const v = Number(e.target.value); draft.kcalMax = v >= 1500 ? null : v; refresh(); };
  $("#prot").oninput = e => { const v = Number(e.target.value); draft.protMin = v <= 0 ? null : v; refresh(); };
  $("#quick").onchange = e => { draft.quick = e.target.checked; refresh(); };
  el.querySelectorAll("[data-badge]").forEach(i => i.onchange = () => {
    draft.badges = i.checked ? [...draft.badges, i.dataset.badge] : draft.badges.filter(b => b !== i.dataset.badge);
    refresh();
  });
  $("#freset").onclick = () => { prefs = { ...DEFAULT_PREFS }; savePrefs(); el.remove(); route(); };
  $("#fapply").onclick = () => { prefs = draft; savePrefs(); el.remove(); route(); };
  refresh();
}
const FSTORE = "folders-cache";
const readFolders = () => { try { return JSON.parse(ls.get(FSTORE)) || []; } catch { return []; } };
const writeFolders = f => ls.set(FSTORE, JSON.stringify(f));
const plural = (n, w) => `${n} ${w}${n > 1 ? "s" : ""}`;
let recipeBack = "#/";  // où ramène le bouton retour d'une fiche (accueil ou dossier)

function cacheRecipe(r) {
  if (r.status === "done") writeStore([r, ...readStore().filter(x => x.id !== r.id)].sort((a, b) => b.created_at - a.created_at));
}
const offlineBanner = () => offline
  ? `<div class="offline">Mac injoignable : tu consultes ton carnet hors ligne. Les liens que tu ajoutes sont gardés
     et seront importés dès que le Mac répond.</div>` : "";

/* ---------- Utilitaires ---------- */
function toast(msg) {
  const t = Object.assign(document.createElement("div"), { className: "toast fade", textContent: msg });
  document.body.append(t); setTimeout(() => t.remove(), 2200);
}
function fmtQty(q) {
  if (q == null) return "";
  const r = Math.round(q * 100) / 100;
  const fr = { 0.25: "¼", 0.5: "½", 0.75: "¾", 0.33: "⅓", 0.67: "⅔" };
  const whole = Math.floor(r), frac = Math.round((r - whole) * 100) / 100;
  if (fr[frac]) return (whole || "") + fr[frac];
  return r.toLocaleString("fr-FR");
}
// Les ingrédients comptés à la pièce (œufs, gousses...) restent des nombres entiers
const isCount = i => !i.unit || /^pi[eè]ces?$/i.test(i.unit.trim());
const unitLabel = i => isCount(i) ? "" : i.unit;
const scaled = (i, ratio) => i.quantity == null ? null
  : isCount(i) && Number.isInteger(i.quantity) ? Math.max(1, Math.round(i.quantity * ratio)) : i.quantity * ratio;
const minutes = m => m == null ? "–" : m >= 60 ? `${Math.floor(m / 60)} h${m % 60 ? " " + (m % 60) : ""}` : `${m} min`;
const total = d => (d.prep_minutes || 0) + (d.cook_minutes || 0) || null;
const photo = r => `<div class="photo" style="${r.thumbnail ? `background-image:url('${esc(r.thumbnail)}')` : ""}">
  ${r.thumbnail ? "" : r.status === "pending" ? '<div class="spinner"></div>' : ICONS.bowl}</div>`;
const today = () => new Date().toLocaleDateString("fr-FR", { weekday: "long", day: "numeric", month: "long" });

/* ---------- Accueil ---------- */
async function home() {
  const token = ++navToken;
  const cached = readStore(), cachedF = readFolders();
  let state = null;
  if (cached.length || cachedF.length) state = renderHome(cached, cachedF);
  const [fresh, freshF] = await Promise.all([getJSON("/api/recipes"), getJSON("/api/folders")]);
  if (token !== navToken) return;  // l'utilisateur a changé d'écran entre-temps
  if (fresh) writeStore(fresh);
  if (freshF) writeFolders(freshF);
  const list = fresh || cached, folders = freshF || cachedF;
  if (JSON.stringify([list, folders, offline, readQueue(), prefs]) !== state) renderHome(list, folders);
  const busy = list.some(r => r.status === "pending" || r.nutrition_status === "pending") || folders.some(f => f.status === "sorting");
  if (!offline && busy) timer = setTimeout(route, 4000);
}

function folderTile(f) {
  const covers = (f.covers || []).slice(0, 4);
  const cls = ["empty", "one", "two", "three", ""][covers.length];
  const inner = covers.length ? covers.map(c => `<div style="background-image:url('${esc(c)}')"></div>`).join("") : ICONS.folder;
  return `<a class="folder" href="#/d/${f.id}"><div class="cover ${cls}">${inner}</div><b>${esc(f.name)}</b>
    <span class="meta">${f.status === "sorting" ? "Rangement…" : plural(f.count, "recette")}</span></a>`;
}

function renderHome(list, folders = []) {
  recipeBack = "#/";
  const typed = document.querySelector("#add input")?.value || "";
  const done = list.filter(r => r.status === "done" && r.data?.is_recipe);
  const tags = [...new Set(done.flatMap(r => r.data.tags || []))].slice(0, 12);
  if (activeTag && !tags.includes(activeTag)) activeTag = "";

  const header = `<div class="top"><div><div class="eyebrow">${esc(today())}</div>
      <h1>Ton carnet<br><em>de cuisine</em></h1></div>
      <button class="icon-btn" id="theme" aria-label="Changer de thème">${isDark() ? ICONS.sun : ICONS.moon}</button></div>
    ${offlineBanner()}
    <form class="import" id="add">
      <input type="text" inputmode="url" autocomplete="off" name="url" aria-label="Lien de la vidéo"
        placeholder="${offline ? "Hors ligne : colle un lien, il sera importé plus tard" : "Colle un lien TikTok, Instagram…"}">
      <button class="btn">${offline ? "Garder" : "Ajouter"}</button>
    </form>
    ${queueHtml()}`;

  if (!list.length) {
    $view.innerHTML = header + (readQueue().length ? "" : `<div class="empty fade">${ICONS.book}
      <h2>Ton carnet t'attend</h2>
      <p>Colle le lien d'une vidéo de recette : on la regarde pour toi et on y écrit la recette, ingrédients et étapes compris.</p></div>`);
  } else {
    const byTag = list.filter(r => !activeTag || (r.data?.tags || []).includes(activeTag));
    const shown = applyPrefs(byTag);
    const plain = prefs.sort === "recent" && !filtersCount();  // vue par défaut : la dernière recette en grand
    const [first, ...rest] = plain ? shown : [null, ...shown];
    const foldersRow = folders.length || !offline ? `<div class="rule eyebrow">Mes dossiers</div><div class="folders">
      ${folders.map(folderTile).join("")}
      ${offline ? "" : `<button class="folder new" id="new-folder"><div class="cover">${ICONS.plus}</div>
        <b>Nouveau dossier</b><span class="meta">Healthy, prise de masse…</span></button>`}</div>` : "";
    const n = filtersCount();
    const toolbar = done.length ? `<div class="toolbar"><button class="tool" id="filters">${ICONS.sliders} Trier et filtrer${n ? ` · ${n}` : ""}</button>
      ${activeFilterChips().map(([label, key]) => `<button class="chip on small" data-clear="${esc(key)}" aria-label="Retirer : ${esc(label)}">${esc(label)} ✕</button>`).join("")}</div>` : "";
    const heading = plain ? "Dans ton carnet"
      : `${plural(shown.length, "recette")}${prefs.sort !== "recent" ? ` · ${SORTS[prefs.sort].toLowerCase()}` : ""}`;
    $view.innerHTML = header + foldersRow + `
      ${tags.length > 1 ? `<div class="chips"><button class="chip ${activeTag ? "" : "on"}" data-tag="">Tout</button>
        ${tags.map(t => `<button class="chip ${t === activeTag ? "on" : ""}" data-tag="${esc(t)}">${esc(t)}</button>`).join("")}</div>` : ""}
      ${toolbar}
      <div class="fade">${first ? feature(first) : ""}
      ${rest.length ? `<div class="rule eyebrow">${esc(heading)}</div><div class="grid">${rest.map(card).join("")}</div>` : ""}
      ${!shown.length ? `<div class="empty"><p>Aucune recette ne correspond à ces filtres.</p>
        <button class="btn ghost" id="reset-filters" style="margin-top:12px">Effacer les filtres</button></div>` : ""}</div>`;
    $view.querySelectorAll("[data-tag]").forEach(b => b.onclick = () => { activeTag = b.dataset.tag; renderHome(list, folders); });
    $view.querySelectorAll("[data-clear]").forEach(b => b.onclick = () => { clearPref(b.dataset.clear); renderHome(list, folders); });
    const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
    on("new-folder", () => folderSheet());
    on("filters", () => filtersSheet());
    on("reset-filters", () => { prefs = { ...DEFAULT_PREFS }; savePrefs(); renderHome(list, folders); });
  }

  $view.querySelectorAll("[data-unqueue]").forEach(b => b.onclick = () => {
    writeQueue(readQueue().filter(x => x.url !== b.dataset.unqueue));
    renderHome(list, folders);
  });
  document.getElementById("theme").onclick = toggleTheme;
  document.getElementById("add").onsubmit = async e => {
    e.preventDefault();
    const form = e.target, url = form.url.value.trim();
    // Accepte aussi le texte copié depuis TikTok (« Regarde ça ! https://… ») : on y cherche le lien
    if (!/https?:\/\/\S+/.test(url)) { toast(url ? "Aucun lien trouvé dans ce texte." : "Colle d'abord un lien."); return; }
    const keep = () => { if (enqueue(url)) { form.reset(); renderHome(list, folders); } };
    if (offline) return keep();
    try {
      const rec = await api("/api/recipes", { method: "POST", body: JSON.stringify({ url }) });
      go(`#/r/${rec.id}`);
    } catch (err) {
      if (err instanceof TypeError) { setOffline(true); keep(); }  // le Mac vient de devenir injoignable
      else toast(err.message);
    }
  };
  if (typed) document.querySelector("#add input").value = typed;
  return JSON.stringify([list, folders, offline, readQueue(), prefs]);
}

function label(r) {
  if (r.status === "pending") return { title: "En cours d'écriture…", meta: "On regarde la vidéo" };
  if (r.status === "error") return { title: "Import impossible", meta: "Touche pour réessayer" };
  const d = r.data, n = r.nutrition?.per_portion;
  const meta = n ? [minutes(total(d)), `${Math.round(n.kcal)} kcal`, `${Math.round(n.protein_g)} g prot.`,
                    prefs.sort === "density" && `${String(r.nutrition.protein_per_100kcal).replace(".", ",")} g/100 kcal`]
                 : [minutes(total(d)), d.difficulty, r.author && "@" + r.author];
  return { title: d.title, meta: meta.filter(Boolean).join(" · ") };
}
function feature(r) {
  const l = label(r);
  return `<a class="feature" href="#/r/${r.id}">${photo(r)}
    <div class="eyebrow" style="margin-top:14px">${r.status === "done" ? "Dernière ajoutée" : ""}</div>
    <h2>${esc(l.title)}</h2><div class="meta">${esc(l.meta)}</div></a>`;
}
function card(r) {
  const l = label(r);
  return `<a class="card ${r.status === "error" ? "err" : ""}" href="#/r/${r.id}">${photo(r)}
    <h3>${esc(l.title)}</h3><div class="meta">${esc(l.meta)}</div></a>`;
}

/* ---------- Fiche recette ---------- */
const detailState = {};  // portions choisies et ingrédients cochés, par recette

async function detail(id) {
  const token = ++navToken;
  scrollTo(0, 0);
  const cached = readStore().find(x => x.id === id);
  let state = null;
  if (cached) state = renderDetail(cached);
  const [fresh, freshF] = await Promise.all([getJSON(`/api/recipes/${id}`), getJSON("/api/folders")]);
  if (token !== navToken) return;
  if (fresh) cacheRecipe(fresh);
  if (freshF) writeFolders(freshF);
  const r = fresh || cached;
  if (!r) throw new Error("Cette recette n'est pas disponible hors ligne.");
  if (JSON.stringify([r, readFolders(), offline]) !== state) renderDetail(r);
  const busy = r.status === "pending" || r.nutrition_status === "pending";
  if (!offline && busy) timer = setTimeout(route, 4000);
}

function renderDetail(r) {
  const id = r.id;
  const back = `<button class="icon-btn" id="back" aria-label="Retour">${ICONS.back}</button>`;
  if (r.status === "pending") {
    $view.innerHTML = `<div class="top">${back}</div><div class="center fade"><div class="spinner"></div>
      <h2>On regarde la vidéo pour toi…</h2>
      <p class="meta">Lecture du texte à l'écran, écoute de l'audio,<br>puis écriture de la recette. 30 s à 2 min.</p></div>`;
    bindBack(); return JSON.stringify([r, readFolders(), offline]);
  }
  if (r.status === "error") {
    $view.innerHTML = `<div class="top">${back}</div><div class="center fade"><h2>Import impossible</h2>
      <p class="meta" style="max-width:420px">${esc(r.error)}</p><div class="actions">
      <button class="btn" id="retry">Réessayer</button><button class="btn ghost" id="del">Supprimer</button></div></div>`;
    document.getElementById("retry").onclick = () => api(`/api/recipes/${id}/retry`, { method: "POST" }).then(route);
    bindBack(); bindDelete(id); return JSON.stringify([r, readFolders(), offline]);
  }
  const d = r.data;
  if (!d.is_recipe) {
    $view.innerHTML = `<div class="top">${back}</div><div class="center fade"><h2>Pas de recette dans cette vidéo</h2>
      <p class="meta" style="max-width:420px">${esc(d.summary)}</p><button class="btn ghost" id="del">Supprimer</button></div>`;
    bindBack(); bindDelete(id); return JSON.stringify([r, readFolders(), offline]);
  }

  const base = d.servings || 1;
  const st = detailState[id] ||= { servings: base, checked: new Set() };

  const render = () => {
    const ratio = st.servings / base;
    const sections = [...new Set(d.ingredients.map(i => i.section || ""))];
    const ingHtml = sections.map(s => `${s ? `<h4>${esc(s)}</h4>` : ""}<ul class="ing">${
      d.ingredients.map((i, idx) => ({ i, idx })).filter(({ i }) => (i.section || "") === s).map(({ i, idx }) => `
        <li data-idx="${idx}" class="${st.checked.has(idx) ? "done" : ""}"><span class="box"></span>
          <span class="q">${esc(fmtQty(scaled(i, ratio)))} ${esc(unitLabel(i))}</span>
          <span class="name">${esc(i.name)}${i.note ? ` <span class="meta">— ${esc(i.note)}</span>` : ""}</span></li>`).join("")}</ul>`).join("");

    $view.innerHTML = `<div class="detail">
      <div class="hero">${photo(r)}<button class="icon-btn" id="back" aria-label="Retour">${ICONS.back}</button></div>
      <div class="eyebrow">${(d.tags || []).map(esc).join(" · ")}</div>
      <h2>${esc(d.title)}</h2>
      <p class="summary">${esc(d.summary)}</p>
      <div class="meta">Une recette de <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.author ? "@" + r.author : "la vidéo originale")}</a></div>
      ${folderChips(r)}
      <div class="facts">
        <div><span class="eyebrow">Préparation</span><b>${minutes(d.prep_minutes)}</b></div>
        <div><span class="eyebrow">Cuisson</span><b>${minutes(d.cook_minutes)}</b></div>
        <div><span class="eyebrow">Niveau</span><b>${esc(d.difficulty || "–")}</b></div>
      </div>
      ${macroStrip(r, st)}
      <button class="btn cook-cta" id="cook">${ICONS.pan} Commencer à cuisiner</button>
      <div class="sec-title"><h3>Ingrédients</h3>
        <div class="stepper"><button data-s="-1" aria-label="Moins de personnes">−</button>
        <span>${st.servings} pers.</span><button data-s="1" aria-label="Plus de personnes">+</button></div></div>
      ${ingHtml}
      <div class="sec-title"><h3>Préparation</h3></div>
      <ol class="steps">${d.steps.map(s => `<li><span>${esc(s)}</span></li>`).join("")}</ol>
      ${nutritionHtml(r, st)}
      ${d.tips?.length ? `<div class="note"><h3>Le mot du chef</h3><ul>${d.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></div>` : ""}
      <div class="actions">
        <button class="btn ghost" id="copy">Copier la liste de courses</button>
        ${offline ? "" : `<button class="btn ghost" id="del">Supprimer</button>`}
      </div></div>`;

    $view.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      st.servings = Math.max(1, st.servings + Number(b.dataset.s)); render();
    });
    $view.querySelectorAll("ul.ing li").forEach(li => li.onclick = () => {
      const i = Number(li.dataset.idx); st.checked.has(i) ? st.checked.delete(i) : st.checked.add(i); li.classList.toggle("done");
    });
    document.getElementById("copy").onclick = () => {
      const lines = d.ingredients.filter((_, i) => !st.checked.has(i)).map(i =>
        `- ${[fmtQty(scaled(i, ratio)), unitLabel(i), i.name].filter(Boolean).join(" ")}`);
      navigator.clipboard.writeText(`${d.title} (${st.servings} pers.)\n${lines.join("\n")}`).then(() => toast("Liste copiée"));
    };
    document.getElementById("cook").onclick = () => cookMode(d, ratio);
    $view.querySelectorAll("[data-view]").forEach(b => b.onclick = () => { st.view = b.dataset.view; render(); });
    const opt = document.getElementById("with-opt");
    if (opt) opt.onchange = () => { st.optional = opt.checked; render(); };
    const det = $view.querySelector("details.by-ing");
    if (det) det.ontoggle = () => { st.ingOpen = det.open; };
    const run = document.getElementById("nutri-run");
    if (run) run.onclick = () => api(`/api/recipes/${id}/nutrition`, { method: "POST" }).then(route).catch(e => toast(e.message));
    const rg = document.getElementById("range");
    if (rg) rg.onclick = () => rangeSheet(r);
    bindBack(recipeBack); bindDelete(id);
  };
  render();
  return JSON.stringify([r, readFolders(), offline]);
}

function bindBack(target = "#/") { const b = document.getElementById("back"); if (b) b.onclick = () => go(target); }
function bindDelete(id) {
  const b = document.getElementById("del");
  if (b) b.onclick = async () => {
    if (!confirm("Retirer cette recette de ton carnet ?")) return;
    await api(`/api/recipes/${id}`, { method: "DELETE" }); go("#/");
  };
}

/* ---------- Valeurs nutritionnelles ---------- */
const NUT_ROWS = [
  ["protein_g", "Protéines", "g"], ["carbs_g", "Glucides", "g"], ["sugars_g", "dont sucres", "g", true],
  ["fat_g", "Lipides", "g"], ["saturated_fat_g", "dont saturés", "g", true], ["fiber_g", "Fibres", "g"], ["salt_g", "Sel", "g"],
];
const MICRO_ROWS = [
  ["potassium_mg", "Potassium", "mg"], ["magnesium_mg", "Magnésium", "mg"], ["calcium_mg", "Calcium", "mg"],
  ["iron_mg", "Fer", "mg"], ["zinc_mg", "Zinc", "mg"], ["vitamin_c_mg", "Vitamine C", "mg"],
  ["vitamin_d_ug", "Vitamine D", "µg"], ["vitamin_b12_ug", "Vitamine B12", "µg"],
];
function fmtN(v, unit) {
  if (v == null) return "–";
  const digits = unit === "kcal" ? 0 : unit === "µg" || v < 10 ? 1 : 0;
  return `${v.toLocaleString("fr-FR", { maximumFractionDigits: digits })} ${unit}`;
}
// Bloc affiché : avec ou sans les éléments facultatifs
const nutBlock = (n, st) => st.optional === false && n.without_optional ? n.without_optional : n;

function macroStrip(r, st) {
  const n = r.nutrition;
  if (!n) return "";
  const p = nutBlock(n, st).per_portion;
  return `<div class="macros"><div><b>${Math.round(p.kcal)}</b><span>kcal</span></div>
    <div><b>${Math.round(p.protein_g)} g</b><span>Protéines</span></div>
    <div><b>${Math.round(p.carbs_g)} g</b><span>Glucides</span></div>
    <div><b>${Math.round(p.fat_g)} g</b><span>Lipides</span></div></div>
    <div class="macros-note">par portion · <a href="#nutri" onclick="document.getElementById('nutri').scrollIntoView({behavior:'smooth'});return false">tout le détail nutritionnel</a></div>`;
}

function nutritionHtml(r, st) {
  const n = r.nutrition, ns = r.nutrition_status;
  const title = `<div class="sec-title"><h3>Valeurs nutritionnelles</h3></div>`;
  if (!n) {
    if (ns === "pending")
      return `<div class="nutri" id="nutri">${title}<div class="status"><div class="spinner"></div>Calcul des valeurs nutritionnelles en cours…</div></div>`;
    const why = ns === "error" ? `Le calcul a échoué : ${esc(r.error || "erreur inconnue")}` : "Pas encore calculées.";
    return `<div class="nutri" id="nutri">${title}<p class="meta">${why}</p>
      ${offline ? "" : `<button class="btn ghost" id="nutri-run">${ns === "error" ? "Réessayer" : "Calculer"}</button>`}</div>`;
  }
  const b = nutBlock(n, st), view = st.view || "portion";
  let vals, label;
  if (view === "100g" && b.per_100g) { vals = b.per_100g; label = "pour 100 g"; }
  else if (view === "recipe") {
    vals = Object.fromEntries(Object.entries(b.per_portion).map(([k, v]) => [k, v * st.servings]));
    label = `pour ${plural(st.servings, "personne")}`;
  } else { vals = b.per_portion; label = `par portion${b.portion_weight_g ? ` (≈ ${b.portion_weight_g} g)` : ""}`; }
  const RI = n.reference_intakes;
  const pct = k => RI[k] ? `${Math.round(vals[k] * 100 / RI[k])} %` : "";
  const rows = list => list.map(([k, name, unit, sub]) =>
    `<tr class="${sub ? "sub" : ""}"><td>${name}</td><td class="v">${fmtN(vals[k], unit)}</td><td class="pct">${pct(k)}</td></tr>`).join("");
  const sp = b.energy_split;
  const ings = n.ingredients.filter(i => i.grams > 0 || i.kcal > 0);
  return `<div class="nutri" id="nutri">${title}
    <div class="seg" role="group" aria-label="Unité">
      <button data-view="portion" class="${view === "portion" ? "on" : ""}">Portion</button>
      <button data-view="recipe" class="${view === "recipe" ? "on" : ""}">Recette</button>
      ${b.per_100g ? `<button data-view="100g" class="${view === "100g" ? "on" : ""}">100 g</button>` : ""}
    </div>
    ${ns === "pending" ? `<div class="status"><div class="spinner"></div>Mise à jour des valeurs…</div>` : ""}
    ${n.without_optional ? `<label class="switch"><input type="checkbox" id="with-opt" ${st.optional === false ? "" : "checked"}>
      Avec les éléments facultatifs (${esc(n.ingredients.filter(i => i.optional).map(i => i.ingredient).join(", "))})</label>` : ""}
    <div class="kcal"><b>${Math.round(vals.kcal)}</b><span>kcal ${label}</span><span class="meta">· ${pct("kcal")} des apports</span></div>
    <div class="ebar" aria-hidden="true"><i style="width:${sp.protein}%;background:var(--accent)"></i>
      <i style="width:${sp.carbs}%;background:var(--carb)"></i><i style="width:${sp.fat}%;background:var(--fat)"></i></div>
    <div class="legend">
      <div><span class="dot" style="background:var(--accent)"></span>Protéines<b>${fmtN(vals.protein_g, "g")}</b>${sp.protein} % de l'énergie</div>
      <div><span class="dot" style="background:var(--carb)"></span>Glucides<b>${fmtN(vals.carbs_g, "g")}</b>${sp.carbs} % de l'énergie</div>
      <div><span class="dot" style="background:var(--fat)"></span>Lipides<b>${fmtN(vals.fat_g, "g")}</b>${sp.fat} % de l'énergie</div>
    </div>
    <table class="nt">${rows(NUT_ROWS)}</table>
    <h4>Pour les sportifs</h4>
    ${b.badges.length ? `<div class="badges">${b.badges.map(x => `<span class="badge">${esc(x)}</span>`).join("")}</div>` : ""}
    <table class="nt">
      <tr><td>Protéines pour 100 kcal</td><td class="v">${fmtN(b.protein_per_100kcal, "g")}</td><td class="pct"></td></tr>
      ${b.carb_protein_ratio != null ? `<tr><td>Rapport glucides / protéines</td><td class="v">${b.carb_protein_ratio.toLocaleString("fr-FR")} : 1</td><td class="pct"></td></tr>` : ""}
      ${b.portion_weight_g ? `<tr><td>Poids d'une portion</td><td class="v">≈ ${b.portion_weight_g} g</td><td class="pct"></td></tr>` : ""}
    </table>
    <h4>Micronutriments</h4>
    <table class="nt">${rows(MICRO_ROWS)}</table>
    <details class="by-ing" ${st.ingOpen ? "open" : ""}><summary>Détail par ingrédient (recette entière)</summary>
      <table class="nt"><tr><td class="meta">Ingrédient</td><td class="v meta">Poids</td><td class="v meta">Énergie</td><td class="v meta">Prot.</td></tr>
      ${ings.map(i => `<tr><td>${esc(i.ingredient)}${i.optional ? ` <span class="meta">(facultatif)</span>` : ""}${i.quantity_estimated ? ` <span class="meta">(quantité estimée)</span>` : ""}</td>
        <td class="v">${Math.round(i.grams)} g</td><td class="v">${Math.round(i.kcal)} kcal</td><td class="v">${fmtN(i.protein_g, "g")}</td></tr>`).join("")}</table>
    </details>
    <p class="fine">Estimation calculée à partir des ingrédients (fiabilité ${esc(n.confidence)}). ${esc(n.notes)}
      Les % se rapportent aux apports de référence d'un adulte (2 000 kcal).
      ${offline ? "" : `<button class="link-btn" id="nutri-run">Recalculer</button>`}</p>
  </div>`;
}

/* ---------- Dossiers ---------- */
function folderChips(r) {
  const all = readFolders();
  const mine = (r.folders || []).map(fid => all.find(f => f.id === fid)).filter(Boolean);
  if (!mine.length && offline) return "";
  return `<div class="fchips">${mine.map(f => `<a class="fchip" href="#/d/${f.id}">${esc(f.name)}</a>`).join("")}
    ${offline ? "" : `<button class="fchip add" id="range">${mine.length ? "Changer de dossier" : "+ Ranger dans un dossier"}</button>`}</div>`;
}

async function folderPage(fid) {
  const token = ++navToken;
  scrollTo(0, 0);
  const cf = readFolders().find(f => f.id === fid), cl = readStore();
  let state = null;
  if (cf) state = renderFolder(cf, cl);
  const [fl, list] = await Promise.all([getJSON("/api/folders"), getJSON("/api/recipes")]);
  if (token !== navToken) return;
  if (fl) writeFolders(fl);
  if (list) writeStore(list);
  const f = readFolders().find(x => x.id === fid);
  if (!f) { go("#/"); return; }  // dossier supprimé entre-temps
  const recipes = list || cl;
  if (JSON.stringify([f, recipes, offline]) !== state) renderFolder(f, recipes);
  if (!offline && f.status === "sorting") timer = setTimeout(route, 4000);
}

function renderFolder(f, list) {
  recipeBack = `#/d/${f.id}`;
  const items = applyPrefs(list.filter(r => (r.folders || []).includes(f.id)), { ...DEFAULT_PREFS, sort: prefs.sort });
  const withN = items.filter(r => r.nutrition?.per_portion);
  const avg = k => Math.round(withN.reduce((sum, r) => sum + r.nutrition.per_portion[k], 0) / withN.length);
  $view.innerHTML = `<div class="top"><button class="icon-btn" id="back" aria-label="Retour">${ICONS.back}</button>
      ${offline ? "" : `<button class="btn ghost" id="edit">Modifier</button>`}</div>
    ${offlineBanner()}
    <div class="fhead fade"><div class="eyebrow">Dossier</div><h2>${esc(f.name)}</h2>
      ${f.description ? `<p class="summary">${esc(f.description)}</p>` : ""}
      <div class="meta">${plural(items.length, "recette")}${withN.length
        ? ` · en moyenne ${avg("kcal")} kcal et ${avg("protein_g")} g de protéines par portion` : ""}</div></div>
    ${f.status === "sorting" ? `<div class="status"><div class="spinner"></div>Je range tes recettes dans ce dossier…</div>` : ""}
    ${f.error ? `<div class="status">Le rangement automatique a échoué : ${esc(f.error)}</div>` : ""}
    ${items.length ? `<div class="grid fade" style="margin-top:22px">${items.map(card).join("")}</div>`
      : `<div class="empty"><p>Ce dossier est vide pour l'instant. Ouvre une recette et touche « Ranger dans un dossier »${
          offline ? "" : ", ou lance le rangement automatique"}.</p></div>`}
    ${offline ? "" : `<div class="actions" style="margin-top:28px">
      <button class="btn ghost" id="sort" ${f.status === "sorting" ? "hidden" : ""}>Ranger automatiquement</button>
      <button class="btn ghost" id="fdel">Supprimer le dossier</button></div>`}`;
  bindBack("#/");
  const on = (id, fn) => { const el = document.getElementById(id); if (el) el.onclick = fn; };
  on("edit", () => folderSheet(f));
  on("sort", () => api(`/api/folders/${f.id}/sort`, { method: "POST" }).then(route).catch(e => toast(e.message)));
  on("fdel", async () => {
    if (!confirm(`Supprimer le dossier « ${f.name} » ? Les recettes restent dans ton carnet.`)) return;
    await api(`/api/folders/${f.id}`, { method: "DELETE" });
    writeFolders(readFolders().filter(x => x.id !== f.id));
    go("#/");
  });
  return JSON.stringify([f, list, offline]);
}

function openSheet(html, onClose = () => {}) {
  const wrap = document.createElement("div");
  wrap.className = "sheet-wrap fade";
  wrap.innerHTML = `<div class="sheet" role="dialog" aria-modal="true">${html}</div>`;
  wrap.close = () => { wrap.remove(); onClose(); };
  wrap.addEventListener("click", e => { if (e.target === wrap) wrap.close(); });
  document.body.append(wrap);
  return wrap;
}

function folderSheet(f = null, onCreated = null) {
  const el = openSheet(`<h3>${f ? "Modifier le dossier" : "Nouveau dossier"}</h3>
    <form id="ff" novalidate>
      <label class="field"><span>Nom</span>
        <input name="name" maxlength="60" placeholder="Healthy" value="${esc(f?.name || "")}" autocomplete="off"></label>
      <label class="field"><span>Ce qui va dedans (facultatif, aide le rangement automatique)</span>
        <textarea name="description" rows="3" maxlength="300" placeholder="Moins de 600 kcal par portion, plein de légumes">${esc(f?.description || "")}</textarea></label>
      ${f ? "" : `<label class="check-row" style="border:0"><input type="checkbox" name="auto" checked>
        Y ranger tout de suite mes recettes qui correspondent</label>`}
      <div class="err-text" id="ferr" role="alert"></div>
      <div class="actions"><button type="button" class="btn ghost" id="fcancel">Annuler</button>
        <button class="btn">${f ? "Enregistrer" : "Créer le dossier"}</button></div>
    </form>`);
  const err = el.querySelector("#ferr"), name = el.querySelector("input[name=name]");
  name.oninput = () => { err.textContent = ""; };
  el.querySelector("#fcancel").onclick = () => el.remove();
  el.querySelector("#ff").onsubmit = async e => {
    e.preventDefault();
    const fd = new FormData(e.target);
    const body = { name: fd.get("name").trim(), description: fd.get("description").trim() };
    if (!body.name) { err.textContent = "Donne un nom à ton dossier."; name.focus(); return; }
    try {
      const res = f ? await api(`/api/folders/${f.id}`, { method: "PATCH", body: JSON.stringify(body) })
                    : await api("/api/folders", { method: "POST", body: JSON.stringify({ ...body, auto: fd.get("auto") === "on" }) });
      el.remove();
      if (onCreated) await onCreated(res);
      route();
    } catch (ex) { err.textContent = ex.message; }
  };
  setTimeout(() => name.focus(), 60);
}

function rangeSheet(r) {
  const folders = readFolders();
  const el = openSheet(`<h3>Ranger dans…</h3>
    <div id="flist">${folders.map(f => `<label class="check-row"><input type="checkbox" value="${f.id}"
      ${(r.folders || []).includes(f.id) ? "checked" : ""}> ${esc(f.name)}</label>`).join("")
      || `<p class="meta">Tu n'as pas encore de dossier : crée le premier.</p>`}</div>
    <div class="actions"><button class="btn ghost" id="fnew">${ICONS.plus.replace("<svg", '<svg width="16" height="16" style="vertical-align:-3px"')} Nouveau dossier</button>
      <button class="btn" id="fdone">Terminé</button></div>`, route);
  const checked = () => [...el.querySelectorAll("#flist input:checked")].map(i => i.value);
  const save = ids => api(`/api/recipes/${r.id}/folders`, { method: "PUT", body: JSON.stringify({ folder_ids: ids }) })
    .then(upd => { r.folders = upd.folders; cacheRecipe(upd); }).catch(e => toast(e.message));
  el.querySelectorAll("#flist input").forEach(i => i.onchange = () => save(checked()));
  el.querySelector("#fdone").onclick = () => el.close();
  el.querySelector("#fnew").onclick = () => {
    const ids = checked();
    el.remove();
    folderSheet(null, nf => save([...ids, nf.id]));
  };
}

/* ---------- Mode cuisine : une étape à la fois, écran allumé, minuteurs ---------- */
function findDuration(text) {
  const m = text.match(/(\d+(?:[.,]\d+)?)\s*(?:à\s*\d+\s*)?(h|heures?|min(?:utes?)?|s(?:ec(?:ondes?)?)?)\b/i);
  if (!m) return null;
  const n = parseFloat(m[1].replace(",", ".")), u = m[2].toLowerCase();
  return Math.round(u.startsWith("h") ? n * 3600 : u.startsWith("m") ? n * 60 : n);
}
const fmtTime = s => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;

async function cookMode(d, ratio) {
  let i = 0, lock = null, tick = null, left = 0;
  try { lock = await navigator.wakeLock?.request("screen"); } catch {}
  const el = document.createElement("div");
  el.className = "cook fade";
  document.body.append(el);
  document.body.style.overflow = "hidden";

  const close = () => { clearInterval(tick); lock?.release?.(); el.remove(); document.body.style.overflow = ""; };
  const draw = () => {
    clearInterval(tick); tick = null;
    const step = d.steps[i], dur = findDuration(step);
    left = dur || 0;
    // Rappel des quantités des ingrédients cités dans l'étape
    const words = new Set(step.toLowerCase().split(/[^a-zà-ÿœæ]+/));
    const mentioned = x => {
      const key = x.name.toLowerCase().split(/[^a-zà-ÿœæ]+/).find(w => w.length > 2);
      return key && (words.has(key) || words.has(key + "s") || words.has(key.replace(/s$/, "")));
    };
    const ings = d.ingredients.filter(mentioned)
      .map(x => [fmtQty(scaled(x, ratio)), unitLabel(x), x.name].filter(Boolean).join(" "));
    el.innerHTML = `<div class="cook-head"><span class="eyebrow">Étape ${i + 1} sur ${d.steps.length}</span>
        <button class="icon-btn" id="x" aria-label="Quitter le mode cuisine">${ICONS.close}</button></div>
      <div class="progress"><i style="width:${(i + 1) / d.steps.length * 100}%"></i></div>
      <div class="cook-body"><div class="cook-num">${String(i + 1).padStart(2, "0")}</div>
        <div class="cook-text">${esc(step)}</div>
        ${ings.length ? `<div class="cook-ings">${ings.map(esc).join(" · ")}</div>` : ""}
        ${dur ? `<button class="timer" id="t" style="margin-top:22px">Minuteur ${fmtTime(dur)}</button>` : ""}</div>
      <div class="cook-nav"><button class="btn ghost" id="prev" ${i ? "" : 'style="visibility:hidden"'}>Précédente</button>
        <button class="btn" id="next">${i < d.steps.length - 1 ? "Étape suivante" : "Bon appétit"}</button></div>`;
    el.querySelector("#x").onclick = close;
    el.querySelector("#prev").onclick = () => { i--; draw(); };
    el.querySelector("#next").onclick = () => { if (i < d.steps.length - 1) { i++; draw(); } else close(); };
    const t = el.querySelector("#t");
    if (t) t.onclick = () => {
      if (tick) { clearInterval(tick); tick = null; t.classList.remove("running", "ring"); left = dur; t.textContent = `Minuteur ${fmtTime(dur)}`; return; }
      t.classList.add("running");
      t.textContent = fmtTime(left);
      tick = setInterval(() => {
        left--;
        t.textContent = left > 0 ? fmtTime(left) : "C'est prêt";
        if (left <= 0) { clearInterval(tick); tick = null; t.classList.add("ring"); navigator.vibrate?.([300, 150, 300]); beep(); }
      }, 1000);
    };
  };
  draw();
}
function beep() {
  try {
    const ctx = new AudioContext();
    [0, .35, .7].forEach(at => {
      const o = ctx.createOscillator(), g = ctx.createGain();
      o.frequency.value = 880; o.connect(g); g.connect(ctx.destination);
      g.gain.setValueAtTime(.2, ctx.currentTime + at); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + at + .3);
      o.start(ctx.currentTime + at); o.stop(ctx.currentTime + at + .3);
    });
  } catch {}
}

/* ---------- Recharger et revenir en arrière (l'appli d'écran d'accueil n'a pas de barre de navigation) ---------- */
async function hardReload() {
  // Rechargement complet : on va chercher la dernière version de l'appli et on réinterroge le Mac
  ls.set("offline-hint", "0");
  try { await (await navigator.serviceWorker?.getRegistration())?.update(); } catch {}
  location.reload();
}
function goBack() {
  if (document.querySelector(".sheet-wrap, .cook")) return;  // fenêtre ou mode cuisine ouverts : pas de retour
  const b = document.getElementById("back");
  if (b) b.click();
}
(() => {
  const ptr = Object.assign(document.createElement("div"), { className: "ptr", innerHTML: ICONS.refresh });
  const sb = Object.assign(document.createElement("div"), { className: "swipe-back", innerHTML: ICONS.back });
  document.body.append(ptr, sb);
  const PULL = 70, SWIPE = 80;
  let g = null;  // geste en cours : { kind: "pull" | "back", x, y, d }
  addEventListener("touchstart", e => {
    const t = e.touches[0], el = e.target;
    g = null;
    if (e.touches.length !== 1 || el.closest(".sheet-wrap, .cook")) return;  // fenêtre ou mode cuisine ouverts
    // Bord gauche : retour (sauf sur les rangées qui défilent horizontalement)
    if (t.clientX < 24 && document.getElementById("back") && !el.closest(".folders, .chips"))
      g = { kind: "back", x: t.clientX, y: t.clientY, d: 0 };
    else if (scrollY <= 0) g = { kind: "pull", x: t.clientX, y: t.clientY, d: 0 };
  }, { passive: true });
  addEventListener("touchmove", e => {
    if (!g) return;
    const t = e.touches[0], dx = t.clientX - g.x, dy = t.clientY - g.y;
    if (g.kind === "pull") {
      if (dy <= 0 || Math.abs(dx) > dy || scrollY > 0) { g.d = 0; ptr.style.opacity = 0; return; }
      g.d = Math.min(dy * 0.5, 110);
      ptr.style.opacity = Math.min(g.d / PULL, 1);
      ptr.style.transform = `translateY(${g.d - 50}px) rotate(${g.d * 3}deg)`;
      ptr.classList.toggle("ready", g.d >= PULL);
    } else {
      if (dx <= 0 || Math.abs(dy) > dx) { g.d = 0; sb.style.opacity = 0; return; }
      g.d = Math.min(dx * 0.6, 100);
      sb.style.opacity = Math.min(g.d / SWIPE, 1);
      sb.style.transform = `translateX(${g.d - 40}px)`;
      sb.classList.toggle("ready", g.d >= SWIPE * 0.75);
    }
  }, { passive: true });
  addEventListener("touchend", () => {
    if (!g) return;
    const { kind, d } = g;
    g = null;
    if (kind === "pull" && d >= PULL) {
      ptr.classList.add("spin");
      ptr.style.transform = "translateY(20px)";
      hardReload();
      return;
    }
    if (kind === "back" && d >= SWIPE * 0.75) goBack();
    for (const el of [ptr, sb]) { el.style.opacity = 0; el.style.transform = ""; el.classList.remove("ready"); }
  });
})();

/* ---------- Navigation ---------- */
function go(hash) {
  if (document.startViewTransition) document.startViewTransition(() => { location.hash = hash; });
  else location.hash = hash;
}
function route() {
  clearTimeout(timer);
  const m = location.hash.match(/^#\/r\/(\w+)/), fm = location.hash.match(/^#\/d\/(\w+)/);
  (m ? detail(m[1]) : fm ? folderPage(fm[1]) : home()).catch(e => $view.innerHTML = `<div class="center"><h2>Oups</h2><p class="meta">${esc(e.message)}</p></div>`);
}
// Raccourci de partage ouvert alors que le Mac est injoignable : le service worker a servi
// l'appli à la place de /share ; on garde le lien pour l'envoyer plus tard.
if (location.pathname === "/share") {
  const q = new URLSearchParams(location.search);
  setOffline(true);
  enqueue([q.get("url"), q.get("text"), q.get("title")].filter(Boolean).join(" "));
  history.replaceState(null, "", "/#/");
}
addEventListener("hashchange", route);
// Retour sur l'appli ou retour du réseau : on revérifie tout de suite si le Mac répond
addEventListener("online", () => offline && route());
document.addEventListener("visibilitychange", () => document.visibilityState === "visible" && offline && route());
matchMedia("(prefers-color-scheme: dark)").addEventListener("change", () => { if (!getTheme()) route(); });
route();
if ("serviceWorker" in navigator) {
  // Nouvelle version installée : on recharge une fois pour l'afficher tout de suite
  // (pas au tout premier chargement, quand aucune version n'était encore installée)
  const hadController = !!navigator.serviceWorker.controller;
  let reloading = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (hadController && !reloading) { reloading = true; location.reload(); }
  });
  navigator.serviceWorker.register("/sw.js", { updateViaCache: "none" }).catch(() => {});
}
</script>
