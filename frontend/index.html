<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mes Recettes</title>
<link rel="manifest" href="/manifest.json">
<meta name="theme-color" content="#e8590c">
<meta name="apple-mobile-web-app-capable" content="yes">
<style>
  :root {
    --bg: #faf7f2; --card: #ffffff; --ink: #2b2118; --muted: #8a7b6d;
    --line: #ece4d9; --accent: #e8590c; --accent-soft: #fff0e6; --danger: #c92a2a;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17130f; --card: #221c16; --ink: #f3ebe1; --muted: #a8998a;
            --line: #362c22; --accent: #ff8a3d; --accent-soft: #3a2616; --danger: #ff6b6b; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 760px; margin: 0 auto; padding: 16px 16px 64px; }
  header { display: flex; align-items: center; gap: 10px; margin: 8px 0 18px; }
  header h1 { font-size: 24px; margin: 0; letter-spacing: -.02em; }
  header a { color: inherit; text-decoration: none; }
  a { color: var(--accent); }
  form { display: flex; gap: 8px; margin-bottom: 20px; }
  input[type=url], input[type=search] { flex: 1; min-width: 0; padding: 12px 14px; border-radius: 12px;
         border: 1px solid var(--line); background: var(--card); color: var(--ink); font-size: 16px; }
  button { border: 0; border-radius: 12px; padding: 12px 16px; font-size: 15px; font-weight: 600;
           background: var(--accent); color: #fff; cursor: pointer; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; overflow: hidden;
          text-decoration: none; color: inherit; display: flex; flex-direction: column; }
  .thumb { aspect-ratio: 4/3; background: var(--accent-soft) center/cover no-repeat;
           display: grid; place-items: center; font-size: 40px; }
  .card .body { padding: 12px 14px; }
  .card h3 { margin: 0 0 4px; font-size: 16px; line-height: 1.3; }
  .meta { color: var(--muted); font-size: 13px; }
  .pill { display: inline-block; padding: 2px 10px; border-radius: 99px; background: var(--accent-soft);
          color: var(--accent); font-size: 12px; font-weight: 600; margin: 0 4px 4px 0; }
  .err { color: var(--danger); }
  .spinner { width: 28px; height: 28px; border: 3px solid var(--line); border-top-color: var(--accent);
             border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hero h2 { font-size: 28px; line-height: 1.2; margin: 6px 0 8px; letter-spacing: -.02em; }
  .facts { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0; }
  .fact { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 8px 12px; font-size: 14px; }
  .fact b { display: block; font-size: 12px; color: var(--muted); font-weight: 500; }
  section { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px; margin: 14px 0; }
  section h3 { margin: 0 0 10px; display: flex; justify-content: space-between; align-items: center; }
  .stepper { display: flex; align-items: center; gap: 10px; font-size: 15px; font-weight: 500; }
  .stepper button { padding: 4px 12px; font-size: 18px; }
  ul.ing { list-style: none; padding: 0; margin: 0; }
  ul.ing li { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--line); cursor: pointer; }
  ul.ing li:last-child { border: 0; }
  ul.ing li.done { opacity: .45; text-decoration: line-through; }
  ul.ing .q { font-weight: 600; min-width: 84px; }
  h4 { margin: 14px 0 4px; color: var(--accent); font-size: 14px; text-transform: uppercase; letter-spacing: .04em; }
  ol.steps { padding-left: 0; margin: 0; list-style: none; counter-reset: s; }
  ol.steps li { counter-increment: s; position: relative; padding: 0 0 14px 42px; }
  ol.steps li::before { content: counter(s); position: absolute; left: 0; top: 0; width: 28px; height: 28px;
           border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center;
           font-size: 14px; font-weight: 700; }
  .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  .center { display: grid; place-items: center; gap: 12px; padding: 40px 0; text-align: center; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--ink);
           color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; }
</style>
</head>
<body>
<main>
  <header><a href="#/">🍳</a><h1><a href="#/">Mes Recettes</a></h1></header>
  <div id="view"></div>
</main>
<script>
const $view = document.getElementById("view");
const api = (path, opts = {}) => fetch(path, { headers: { "Content-Type": "application/json" }, ...opts })
  .then(r => r.ok ? r.json() : r.json().then(e => Promise.reject(new Error(e.detail || r.statusText))));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let timer;

function toast(msg) {
  const t = Object.assign(document.createElement("div"), { className: "toast", textContent: msg });
  document.body.append(t); setTimeout(() => t.remove(), 2200);
}

function fmtQty(q) {
  if (q == null) return "";
  const r = Math.round(q * 100) / 100;
  const fr = { 0.25: "¼", 0.5: "½", 0.75: "¾", 0.33: "⅓", 0.67: "⅔" };
  const whole = Math.floor(r), frac = Math.round((r - whole) * 100) / 100;
  if (fr[frac]) return (whole || "") + fr[frac];
  return r.toLocaleString("fr-FR");
}

// Les ingrédients comptés à la pièce (œufs, gousses...) restent des nombres entiers
const scaled = (i, ratio) => i.quantity == null ? null
  : !i.unit && Number.isInteger(i.quantity) ? Math.max(1, Math.round(i.quantity * ratio)) : i.quantity * ratio;

const minutes = m => m == null ? "–" : m >= 60 ? `${Math.floor(m / 60)} h ${m % 60 ? m % 60 : ""}` : `${m} min`;

async function home() {
  const list = await api("/api/recipes");
  $view.innerHTML = `
    <form id="add">
      <input type="url" name="url" placeholder="Colle un lien TikTok, Instagram, YouTube…" required>
      <button>Importer</button>
    </form>
    ${list.length > 3 ? `<form><input type="search" id="q" placeholder="Rechercher une recette, un ingrédient…"></form>` : ""}
    <div class="grid">${list.map(card).join("") || `<p class="meta">Aucune recette pour l'instant. Colle le lien d'une vidéo pour commencer.</p>`}</div>`;
  document.getElementById("add").onsubmit = async e => {
    e.preventDefault();
    try {
      const rec = await api("/api/recipes", { method: "POST", body: JSON.stringify({ url: e.target.url.value }) });
      location.hash = `#/r/${rec.id}`;
    } catch (err) { toast(err.message); }
  };
  const q = document.getElementById("q");
  if (q) q.oninput = () => {
    const term = q.value.toLowerCase();
    document.querySelectorAll(".card").forEach(c => c.style.display = c.dataset.search.includes(term) ? "" : "none");
  };
  if (list.some(r => r.status === "pending")) timer = setTimeout(route, 3000);
}

function card(r) {
  const d = r.data || {};
  const title = r.status === "pending" ? "Analyse en cours…" : r.status === "error" ? "Échec de l'import" : d.title;
  const search = [d.title, ...(d.tags || []), ...(d.ingredients || []).map(i => i.name), r.author].join(" ").toLowerCase();
  return `<a class="card" href="#/r/${r.id}" data-search="${esc(search)}">
    <div class="thumb" style="${r.thumbnail ? `background-image:url('${esc(r.thumbnail)}')` : ""}">
      ${r.thumbnail ? "" : r.status === "pending" ? '<div class="spinner"></div>' : "🍽️"}</div>
    <div class="body"><h3 class="${r.status === "error" ? "err" : ""}">${esc(title)}</h3>
      <div class="meta">${esc(r.author || r.url)}</div>
      <div>${(d.tags || []).slice(0, 3).map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div></div></a>`;
}

async function detail(id) {
  const r = await api(`/api/recipes/${id}`);
  if (r.status === "pending") {
    $view.innerHTML = `<div class="center"><div class="spinner"></div>
      <p><b>On regarde la vidéo pour toi…</b><br><span class="meta">Téléchargement, lecture du texte à l'écran, transcription et rédaction de la recette (30 s à 2 min).</span></p></div>`;
    timer = setTimeout(route, 3000); return;
  }
  if (r.status === "error") {
    $view.innerHTML = `<div class="center"><p class="err"><b>Impossible d'importer cette vidéo.</b></p>
      <p class="meta">${esc(r.error)}</p><div class="actions">
      <button id="retry">Réessayer</button><button class="ghost" id="del">Supprimer</button></div></div>`;
    document.getElementById("retry").onclick = () => api(`/api/recipes/${id}/retry`, { method: "POST" }).then(route);
    bindDelete(id); return;
  }
  const d = r.data;
  if (!d.is_recipe) {
    $view.innerHTML = `<div class="center"><p><b>Pas de recette trouvée dans cette vidéo.</b></p>
      <p class="meta">${esc(d.summary)}</p><button class="ghost" id="del">Supprimer</button></div>`;
    bindDelete(id); return;
  }
  const base = d.servings || 1;
  let servings = base;
  const checked = new Set();

  const render = () => {
    const ratio = servings / base;
    const sections = [...new Set(d.ingredients.map(i => i.section || ""))];
    const ingHtml = sections.map(s => `${s ? `<h4>${esc(s)}</h4>` : ""}<ul class="ing">${
      d.ingredients.map((i, idx) => ({ i, idx })).filter(({ i }) => (i.section || "") === s).map(({ i, idx }) => `
        <li data-idx="${idx}" class="${checked.has(idx) ? "done" : ""}">
          <span class="q">${esc(fmtQty(scaled(i, ratio)))} ${esc(i.unit)}</span>
          <span>${esc(i.name)}${i.note ? ` <span class="meta">— ${esc(i.note)}</span>` : ""}</span></li>`).join("")}</ul>`).join("");

    $view.innerHTML = `
      <div class="hero">
        <div>${(d.tags || []).map(t => `<span class="pill">${esc(t)}</span>`).join("")}</div>
        <h2>${esc(d.title)}</h2>
        <p class="meta">${esc(d.summary)}</p>
        <p class="meta">Par <a href="${esc(r.url)}" target="_blank" rel="noopener">${esc(r.author || "la vidéo originale")}</a> · ${esc(r.platform)}</p>
      </div>
      <div class="facts">
        <div class="fact"><b>Préparation</b>${minutes(d.prep_minutes)}</div>
        <div class="fact"><b>Cuisson</b>${minutes(d.cook_minutes)}</div>
        <div class="fact"><b>Difficulté</b>${esc(d.difficulty || "–")}</div>
      </div>
      <section>
        <h3>Ingrédients <span class="stepper"><button class="ghost" data-s="-1">−</button>
          ${servings} pers.<button class="ghost" data-s="1">+</button></span></h3>
        ${ingHtml}
      </section>
      <section><h3>Étapes</h3><ol class="steps">${d.steps.map(s => `<li>${esc(s)}</li>`).join("")}</ol></section>
      ${d.tips?.length ? `<section><h3>Astuces</h3><ul>${d.tips.map(t => `<li>${esc(t)}</li>`).join("")}</ul></section>` : ""}
      <div class="actions">
        <button id="copy">Copier la liste de courses</button>
        <button class="ghost" id="del">Supprimer</button>
      </div>`;

    $view.querySelectorAll("[data-s]").forEach(b => b.onclick = () => {
      servings = Math.max(1, servings + Number(b.dataset.s)); render();
    });
    $view.querySelectorAll("ul.ing li").forEach(li => li.onclick = () => {
      const i = Number(li.dataset.idx); checked.has(i) ? checked.delete(i) : checked.add(i); li.classList.toggle("done");
    });
    document.getElementById("copy").onclick = () => {
      const lines = d.ingredients.filter((_, i) => !checked.has(i)).map(i =>
        `- ${[fmtQty(scaled(i, ratio)), i.unit, i.name].filter(Boolean).join(" ")}`);
      navigator.clipboard.writeText(`${d.title} (${servings} pers.)\n${lines.join("\n")}`).then(() => toast("Liste copiée ✔"));
    };
    bindDelete(id);
  };
  render();
}

function bindDelete(id) {
  const b = document.getElementById("del");
  if (b) b.onclick = async () => {
    if (!confirm("Supprimer cette recette ?")) return;
    await api(`/api/recipes/${id}`, { method: "DELETE" }); location.hash = "#/";
  };
}

function route() {
  clearTimeout(timer);
  const m = location.hash.match(/^#\/r\/(\w+)/);
  (m ? detail(m[1]) : home()).catch(e => $view.innerHTML = `<p class="err">${esc(e.message)}</p>`);
}
addEventListener("hashchange", route);
route();
</script>
</body>
</html>
